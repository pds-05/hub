apiVersion: v1
kind: Service
metadata:
  name: monitoring-grafana-internal
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    monitor-platform/security-note: "ClusterIP only; external access must use the authenticated frontend proxy"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
