apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-backend
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-backend-scrapeconfig
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["monitoring-grafana"]
    verbs: ["get"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["scrapeconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-backend-scrapeconfig
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: monitor-backend
    namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitor-backend-scrapeconfig
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-backend-config
  namespace: platform
data:
  APP_NAME: "K8s Intelligent Monitoring Platform"
  API_PREFIX: "/api/v1"
  DEBUG: "false"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  PROMETHEUS_URL: "http://monitoring-ack-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  PROMETHEUS_SCRAPE_CONFIG_ENABLED: "true"
  PROMETHEUS_SCRAPE_CONFIG_NAMESPACE: "monitoring"
  PROMETHEUS_SCRAPE_CONFIG_API_VERSION: "monitoring.coreos.com/v1alpha1"
  PROMETHEUS_SCRAPE_CONFIG_LABELS_JSON: '{"release":"monitoring"}'
  PROMETHEUS_TARGET_SCRAPE_INTERVAL: "30s"
  PROMETHEUS_TARGET_SCRAPE_TIMEOUT: "10s"
  PROMETHEUS_ALLOW_PRIVATE_TARGETS: "false"
  TARGET_ALERT_EVALUATION_ENABLED: "true"
  TARGET_ALERT_EVALUATION_INTERVAL_SECONDS: "60"
  ALERTMANAGER_URL: "http://monitoring-ack-prometheus-alertmanager.monitoring.svc.cluster.local:9093"
  LOKI_URL: "http://loki-gateway.logging.svc.cluster.local"
  GRAFANA_URL: "http://monitoring-grafana.monitoring.svc.cluster.local:80/grafana"
  GRAFANA_PUBLIC_URL: "https://pdsaiops.com/grafana"
  GRAFANA_PROVISIONING_ENABLED: "true"
  GRAFANA_ADMIN_SECRET_NAMESPACE: "monitoring"
  GRAFANA_ADMIN_SECRET_NAME: "monitoring-grafana"
  GRAFANA_DATA_PROXY_URL: "http://monitor-backend.platform.svc.cluster.local:8000/api/v1/grafana/proxy"
  GRAFANA_SSO_MODE: "auth-proxy"
  BLACKBOX_EXPORTER_URL: "http://blackbox-exporter.monitoring.svc.cluster.local:9115"
  AI_API_BASE_URL: "https://api.deepseek.com"
  AI_MODEL: "deepseek-v4-flash"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-backend
  namespace: platform
  labels:
    app: monitor-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-backend
  template:
    metadata:
      labels:
        app: monitor-backend
    spec:
      serviceAccountName: monitor-backend
      containers:
        - name: monitor-backend
          image: registry.cn-hangzhou.aliyuncs.com/your-namespace/monitor-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: monitor-backend-config
            - secretRef:
                name: monitor-backend-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-backend
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app: monitor-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitor-backend
  namespace: platform
spec:
  ingressClassName: nginx
  rules:
    - host: api.monitor.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitor-backend
                port:
                  number: 8000
