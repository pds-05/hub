apiVersion: v1
kind: Secret
metadata:
  name: monitor-backend-secret
  namespace: platform
type: Opaque
stringData:
  SECRET_KEY: "replace-with-long-random-string"
  DATABASE_URL: "postgresql+psycopg://monitor_admin:monitor123@postgresql.platform.svc.cluster.local:5432/monitor_platform"
  REDIS_URL: "redis://:redis123@redis.platform.svc.cluster.local:6379/0"
  AI_API_KEY: "replace-with-your-deepseek-api-key"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_EMAIL: ""
  SMTP_USE_TLS: "true"
  GRAFANA_ADMIN_USER: ""
  GRAFANA_ADMIN_PASSWORD: ""
  GRAFANA_DATA_PROXY_SECRET: "" # Optional; derived from SECRET_KEY when empty.
  GRAFANA_API_KEY: ""