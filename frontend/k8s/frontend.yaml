apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-frontend
  namespace: platform
  labels:
    app: monitor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-frontend
  template:
    metadata:
      labels:
        app: monitor-frontend
    spec:
      containers:
        - name: monitor-frontend
          image: registry.cn-hangzhou.aliyuncs.com/your-namespace/monitor-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-frontend
  namespace: platform
spec:
  type: NodePort
  selector:
    app: monitor-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitor-frontend
  namespace: platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pdsaiops.com
      secretName: pdsaiops-com-tls
  rules:
    - host: pdsaiops.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitor-frontend
                port:
                  number: 80