map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://monitor-backend.platform.svc.cluster.local:8000/api/;
        proxy_http_version 1.1;
        # A Dify diagnosis may take up to the backend's 90-second limit.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_grafana_auth {
        internal;
        proxy_pass http://monitor-backend.platform.svc.cluster.local:8000/api/v1/auth/grafana-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        auth_request /_grafana_auth;
        auth_request_set $grafana_user $upstream_http_x_webauth_user;
        auth_request_set $grafana_email $upstream_http_x_webauth_email;

        proxy_pass http://monitoring-grafana.monitoring.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host monitoring-grafana.monitoring.svc.cluster.local;
        proxy_set_header X-WEBAUTH-USER $grafana_user;
        proxy_set_header X-WEBAUTH-EMAIL $grafana_email;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
